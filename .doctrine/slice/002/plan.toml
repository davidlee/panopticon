# Implementation plan for SL-002 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-002"

[specs]                          # empty in v1 — no spec/requirement registry yet
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# Phase order descends design.md §5/§7. F7 (review): phase 1 ships green against a
# FAKE CompositorSession; the real Sway adapter is phase 2 — there is no coherent
# "Sway through a thin shim" for phase 1. Every phase ends green (`just check`).

[[phase]]
id        = "PHASE-01"
name      = "Neutral core"
objective = """
Stand up compositor/{model,runner,events}.py: the neutral CompositorSession/Client \
contract, the pull->push-inverted runner (process_session consumes observations(), \
never calls get_tree), and the encoder emitting the final source:"desktop" + \
producer + window_id schema — all verified green against a fake CompositorSession. \
Relocate Backoff + IpcEvent; retire the dead ipc.py reconnect symbols (D6/DD9/V1). \
Nothing real is produced yet; this is the contract + shell.
"""
entrance_criteria = [
  { id = "EN-1", text = "Design locked (design.md §10); working tree clean; `just check` green on main." },
]
exit_criteria = [
  { id = "EX-1", text = "compositor/model.py defines WindowRef, DesktopState (to_dict flattens to {window_id,app_id,pid,title,workspace,output}), DesktopObservation{event,fields,state}, and the CompositorSession/CompositorClient protocols. FocusState is not carried alongside (DD3/V6)." },
  { id = "EX-2", text = "compositor/runner.py: process_session(session,store,producer) loops observations() with no get_tree and no state threading/return (F3); run_watcher owns reconnect/backoff and emits compositor_disconnected/compositor_reconnected via encode; Backoff relocated here." },
  { id = "EX-3", text = "compositor/events.py: encode(obs, producer) -> schema.Event{source:'desktop', producer, window_id, **fields}; it is the SOLE injector of source and producer (INV-2); per-event fields preserved verbatim (F8)." },
  { id = "EX-4", text = "Dead ipc.py stream()/IpcDisconnected/IpcReconnected/StreamMessage removed; IpcEvent relocated to compositor/sway/project.py (V1); no production importer of the removed symbols remains (grep clean)." },
  { id = "EX-5", text = "`just check` green (lint zero-warning, tests, format)." },
]
verification = [
  { id = "VT-1", expects = "encode maps a DesktopObservation to an Event with source='desktop', producer, window_id, and the compositor_disconnected/compositor_reconnected names; source/producer are injected only here.", test_file = "tests/test_compositor_events.py", keywords = ["def test_", "encode", "desktop", "producer", "window_id", "compositor_disconnected"], waived = false },
  { id = "VT-2", expects = "process_session drives a fake CompositorSession snapshot-first then deltas then EOF, writing one Event + current-state per observation; run_watcher reconnect emits the neutral disconnect/reconnect pair.", test_file = "tests/test_compositor_runner.py", keywords = ["def test_", "process_session", "run_watcher", "observations", "FakeSession"], waived = false },
  { id = "VT-3", expects = "A source='desktop', producer='sway', window_id sample round-trips through schema.from_dict and the encoder (pins DD4/DD5).", test_file = "tests/test_compositor_events.py", keywords = ["window_id", "from_dict", "producer"], waived = false },
  { id = "VT-4", expects = "DesktopState.to_dict flattens to the current/*.json key set with con_id renamed to window_id; empty state yields the today-empty shape.", test_file = "tests/test_compositor_model.py", keywords = ["def test_", "DesktopState", "to_dict", "window_id"], waived = false },
  { id = "VT-5", expects = "Backoff sequence/reset behaviour preserved after relocation to compositor/runner.py.", test_file = "tests/test_compositor_runner.py", keywords = ["Backoff", "next", "reset"], waived = false },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "Sway adapter + D5"
objective = """
Move Sway behind the CompositorSession contract as a LIVE PROJECTION adapter \
(compositor/sway/{project,session,_i3ipc}.py): relocate the state.py tree-walk \
helpers and the events.py mappings, implement observations() (snapshot-first; a \
container->location index seeded/refreshed by get_tree on structural events; focus \
identity from the event payload), and fix the D5 workspace/output focus bug via the \
projection with its own before/after test. Existing Sway behaviour preserved bar \
the enumerated rename/D5 deltas (§9).
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 exit met — neutral core green against fakes." },
]
exit_criteria = [
  { id = "EX-1", text = "compositor/sway/project.py holds app_id_from_container, find_focused, ancestor_name_of_type, and a focus_state_from_tree that builds a DesktopState; the pure tree-walk is unchanged in behaviour." },
  { id = "EX-2", text = "compositor/sway/session.py implements CompositorSession: the first observation is the snapshot; a container->(workspace,output) index is seeded by get_tree and refreshed by get_tree on structural events (window::new/close/move, workspace::focus/init/empty); window::focus takes identity from the payload and location from the index; output is retained across events that don't carry it (F9)." },
  { id = "EX-3", text = "D5 fixed — on a focus change crossing a workspace/output boundary the emitted workspace/output come from the focused window, not prior state — proven by a dedicated before/after test carrying the prior (buggy) expectation as a documented behaviour-change note." },
  { id = "EX-4", text = "compositor/sway/_i3ipc.py is the relocated CompositorClient and the only i3ipc importer; its IpcEvent import is repointed (V1)." },
  { id = "EX-5", text = "Relocated Sway suites green with only the §9-enumerated assertion edits (con_id->window_id, compositor_* names, the observations() fake); `just check` green." },
]
verification = [
  { id = "VT-1", expects = "D5 before/after: a window::focus that crosses a workspace/output boundary yields the NEW correct workspace/output; the pre-fix expectation is recorded as the documented behaviour change.", test_file = "tests/test_compositor_sway_session.py", keywords = ["def test_", "focus", "workspace", "output", "D5"], waived = false },
  { id = "VT-2", expects = "The Sway session yields a snapshot-first observation stream equivalent to the golden Sway fixture (focus/title/workspace/new/close transitions), modulo the renames.", test_file = "tests/test_compositor_sway_session.py", keywords = ["def test_", "observations", "snapshot"], waived = false },
  { id = "VT-3", expects = "project.py builds a correct DesktopState (window/workspace/output via ancestry) from a get_tree fixture; app_id XWayland fallback preserved.", test_file = "tests/test_compositor_sway_project.py", keywords = ["def test_", "focus_state_from_tree", "app_id_from_container", "output"], waived = false },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-03"
name      = "Schema migration + segmentizer"
objective = """
Consume the desktop stream end to end: store writes raw/desktop-*.jsonl + \
current/desktop.json and side-writes current/sway.json (DD7/D2); the segmentizer \
gains a ('desktop','focus') source (keeping ('sway','focus')), threads `source` \
through derive, keys the focus segment on (producer, output, app_id, workspace) \
(D8), and closes on BOTH sway_disconnected and compositor_disconnected (F6). \
Histogram-key widening is explicitly OUT (deferred to SL-003 — R4/SQ3).
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 exit met — the Sway adapter emits the neutral observation stream." },
]
exit_criteria = [
  { id = "EX-1", text = "RawStore gains a compat-current option: a source='desktop' store writes current/desktop.json AND current/sway.json with the same payload; the raw file is raw/desktop-*.jsonl (falls out of the source param)." },
  { id = "EX-2", text = "segmentizer/__main__.py _SOURCES adds ('desktop','focus') keeping ('sway','focus'); retention _SEGMENT_PREFIX_FOR_RAW adds 'desktop':'focus'; derive is called with source per raw prefix (no longer the bare default)." },
  { id = "EX-3", text = "derive.py focus key is (producer, output, app_id, workspace); segment bodies carry producer + output; _next_focus closes a segment on both 'sway_disconnected' and 'compositor_disconnected'." },
  { id = "EX-4", text = "histogram.py aggregation is unchanged; a notes.md line records the deferred D8 histogram widening (R4) so it is not lost." },
  { id = "EX-5", text = "Segmentizer equivalence: a legacy sway raw corpus (carrying sway_disconnected) derives equivalent focus segments under the dual-name close; `just check` green." },
]
verification = [
  { id = "VT-1", expects = "A source='desktop' RawStore writes both current/desktop.json and current/sway.json atomically with identical payloads.", test_file = "tests/test_store.py", keywords = ["def test_", "desktop", "sway", "current", "write_current"], waived = false },
  { id = "VT-2", expects = "derive_segments keys on (producer,output,app_id,workspace), emits producer+output in segment bodies, and closes on both disconnect event names.", test_file = "tests/test_segmentizer_derive.py", keywords = ["def test_", "producer", "output", "sway_disconnected", "compositor_disconnected"], waived = false },
  { id = "VT-3", expects = "The segmentizer main derives desktop segments (source threaded per prefix) while the kept sway entry still yields source='sway' segments.", test_file = "tests/test_segmentizer_main.py", keywords = ["def test_", "desktop", "focus", "source"], waived = false },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-04"
name      = "CLI + detection"
objective = """
Ship the panopticon-desktop entrypoint (desktop_watcher/__main__.py) with \
--compositor auto|sway (the niri branch raises NotImplementedError pointing at \
SL-003), the connect-validated detection seam (compositor/detect.py), the \
panopticon-sway compatibility wrapper, the pyproject console-script wiring, and the \
nix meta.mainProgram move (D7/DD10) so `nix run` resolves.
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 exit met — the desktop stream is produced, stored, and segmentized." },
]
exit_criteria = [
  { id = "EX-1", text = "desktop_watcher/__main__.py provides panopticon-desktop with --compositor auto|sway; --compositor niri (and the auto both-set/niri path) raise NotImplementedError with an 'lands in SL-003' message — a seam, not a lie (DD10)." },
  { id = "EX-2", text = "compositor/detect.py select_client(compositor) resolves the sway path by connect-attempt and returns (client, producer='sway'); both-set/liveness resolution is documented as deferred to SL-003." },
  { id = "EX-3", text = "panopticon-sway retained as a thin wrapper invoking the neutral watcher with the sway adapter; pyproject console scripts updated; flake.nix meta.mainProgram moved to panopticon-desktop." },
  { id = "EX-4", text = "`just check` green; `nix run` resolves panopticon-desktop (mainProgram)." },
]
verification = [
  { id = "VT-1", expects = "Arg parsing + compositor selection: --compositor sway is accepted; --compositor niri raises NotImplementedError.", test_file = "tests/test_desktop_main.py", keywords = ["def test_", "compositor", "sway", "niri", "NotImplementedError"], waived = false },
  { id = "VT-2", expects = "select_client resolves the sway path and returns producer='sway'; the niri/both-set path is guarded.", test_file = "tests/test_compositor_detect.py", keywords = ["def test_", "select_client", "sway", "producer"], waived = false },
  { id = "VA-1", expects = "flake.nix meta.mainProgram is 'panopticon-desktop' and pyproject exposes both panopticon-desktop and the panopticon-sway wrapper; agent confirms the edits.", waived = false },
  { id = "VH-1", expects = "Human/agent confirms `nix run` launches panopticon-desktop (mainProgram move holds, no nix-run break).", waived = false },
]
specs        = []
requirements = []
