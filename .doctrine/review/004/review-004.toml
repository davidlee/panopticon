disposition = "follow-up"
response = "Plan-sanctioned deferral (plan.md: version skew is out of SL-004 intent, a separate chore unless trivially co-landed in PHASE-03). PHASE-03 did not touch pyproject.toml, so not co-landed. Captured as CHR-003."

