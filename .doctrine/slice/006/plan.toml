[[phase]]
id        = "PHASE-04"
name      = "Docs, corpus dry-run, live acceptance"
objective = """
Make the egress honest in the docs and validate against reality.

- README: replace "Nothing leaves the machine" (line 11) and "No network calls"
  (line 119) with the DEC-002 statement; add the binary-table row, the config
  example, how to enable (config + env file + timer, noting the fixed
  ~/.config env-file path), and that digests are untrusted derived text.
- docs/privacy.md: an egress section stating that capture never touches the
  network, that panopticon-digest is the sole opt-in egress, and exactly what
  leaves the host (host, title, truncated text_content; I1).
- Run `panopticon-digest --dry-run` against the real store. Settle OQ-3
  (min_quality 0.7 vs 0.4), OQ-2 (max_input_chars) and OQ-5 (path rules or
  cooldown, only if the data demands), and check DEFAULT_DENY coverage (OQ-4).
  Record outcomes in notes.md as aggregates only; no URLs or titles.
- Live acceptance (OQ-1): with a user-chosen OpenRouter model, digest a handful
  of pages and inspect the records.
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 completed." },
  { id = "EN-2", text = "The user has chosen an OpenRouter model and provided OPENROUTER_API_KEY (for VH-1 only)." },
]
exit_criteria = [
  { id = "EX-1", text = "README and docs/privacy.md state the DEC-002 egress and exactly what leaves the host; no remaining claim that panopticon makes no network calls at all." },
  { id = "EX-2", text = "OQ-2, OQ-3, OQ-4 and OQ-5 each have a recorded outcome in notes.md (aggregates only); any default changed accordingly with tests updated." },
  { id = "EX-3", text = "`just check` green." },
]
verification = [
  { id = "VA-1", expects = "An agent reads the README and docs/privacy.md and confirms they match design I1, I2 and D11: capture is network-free; digest is the sole opt-in egress; only host, title and text are sent." },
  { id = "VA-2", expects = "A dry-run over the real store completes with no network access; the per-reason counts are recorded in notes.md as aggregates." },
  { id = "VH-1", expects = "The user runs panopticon-digest live on a small --limit and judges the records useful and well-formed (summary, claims, entities), and that the model honours strict json_schema under require_parameters." },
]
specs        = []
requirements = []

# ---------------------------------------------------------------------------
[[phase]]
id        = "PHASE-05"
name      = "Audit remediation"
objective = """
Close the close-out review's findings before the timer is ever enabled.
The finding ids (m1..m5, n1..n7) are the review's; audit.md records each one.

- m1: refuse an API key with surrounding whitespace or control characters
  (exit 2, naming the env var) so http.client never echoes it in a traceback.
- m2: `pending` is total: a non-object row, or a title that is neither a
  string nor null, is bad_row.
- n4: a content_hash that is not 64 lowercase hex chars is bad_row in the
  shell, where store paths are built.
- n1: a non-finite quality_score is bad_row. n2: a non-finite Retry-After
  is ignored.
- n3: deny matching resolves `.`/`..` segments and drops `;` params; numeric
  final labels (`127.1`, `0x7f.1`) count as IP literals (local_host);
  twitter.com joins x.com in DEFAULT_DENY.
- m4: digest.service runs with -v so the design's INFO rows reach the journal.
- m3, m5, n5, n7: amend design.md to match the code (timeout is a backstop,
  not a breaker bound; streaks count since the last success; dry-run logs a
  missing content record; trailing content markers per run).
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-04 completed; close-out review findings received." },
]
exit_criteria = [
  { id = "EX-1", text = "Each code finding (m1, m2, m4, n1-n4) has a test that failed first." },
  { id = "EX-2", text = "design.md states m3, m5, n5 and n7 as built." },
  { id = "EX-3", text = "`just check` green." },
]
verification = [
  { id = "VT-1", expects = "A key with a trailing newline or control character exits 2 with no transport call and no key in the logs.", test_file = "tests/test_digest_main.py", keywords = ["control"], patterns = ["def test_.*key"], waived = false },
  { id = "VT-2", expects = "pending marks non-object rows, non-string titles and NaN/inf quality as bad_row without raising.", test_file = "tests/test_digest_select.py", keywords = ["bad_row", "nan"], patterns = ["def test_"], waived = false },
  { id = "VT-3", expects = "Dot segments, `;` params and numeric-final-label hosts cannot dodge deny or local_host.", test_file = "tests/test_digest_gate.py", keywords = ["..", ";", "0x7f"], patterns = ["def test_"], waived = false },
  { id = "VT-4", expects = "A Retry-After of nan is ignored; a non-hex content_hash never reaches a store path.", test_file = "tests/test_digest_client.py", keywords = ["nan"], patterns = ["def test_"], waived = false },
]
specs        = []
requirements = []
