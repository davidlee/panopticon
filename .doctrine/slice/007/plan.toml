# Implementation plan for SL-007 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-007"

[specs]                          # empty in v1 — no spec/requirement registry yet
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase. Ids are PHASE-NN, immutable; edits append.
[[phase]]
id        = "PHASE-01"
name      = "Closed vocabulary, prompt v2, re-digest"
objective = """
- `prompt.py`: `EntityType(StrEnum)` with the 9 design §5.2 values; the
  schema enum, `Entity.type` and `_is_entity` derive from it; an off-list
  type is `bad_shape` (D3).
- `_SYSTEM` defines each type and says the page is never its own entity.
- `PROMPT_VERSION = "2"`.
- README: the record's `entities` field names the vocabulary.
- Operational: delete the 3 version-1 records; re-run `--limit 3` live.
"""
entrance_criteria = [
  { id = "EN-1", text = "Design SL-007 decisions D1-D4 settled with the user." },
]
exit_criteria = [
  { id = "EX-1", text = "Schema enum, parser and Entity.type share one EntityType source." },
  { id = "EX-2", text = "`just check` green." },
]
verification = [
  { id = "VT-1", expects = "The schema enum equals the EntityType values; every value parses; an off-list type is bad_shape; the system prompt names every type; PROMPT_VERSION is 2.", test_file = "tests/test_digest_prompt.py", keywords = ["EntityType", "enum", "bad_shape", "PROMPT_VERSION"], patterns = ["def test_"], waived = false },
  { id = "VH-1", expects = "The 3 re-digested records carry prompt_version 2 and only vocabulary types, and the user judges the typing sensible." },
]
specs        = []
requirements = []
